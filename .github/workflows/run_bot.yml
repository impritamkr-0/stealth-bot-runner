name: Stealth Bot Runner

on:
  workflow_dispatch: # Allows you to manually trigger the bot with a "Run workflow" button
  # schedule:
  #   - cron: '0 */6 * * *' # Optional: Runs automatically every 6 hours

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository files
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install Google Chrome browser on the runner
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget google-chrome-stable
          google-chrome --version

      # 4. Install Virtual Screen (Xvfb) for pyautogui & GUI elements
      - name: Install Virtual Display dependencies
        run: |
          sudo apt-get install -y xvfb x11-utils

      # 5. Install Python dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 6. Run bot.py inside the Virtual Screen environment
      - name: Execute Bot
        run: |
          xvfb-run --server-args="-screen 0 1920x1080x24" python bot.py
