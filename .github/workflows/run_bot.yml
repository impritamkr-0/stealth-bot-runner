name: Stealth Bot Runner

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Audio & Display Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb x11-utils

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Execute Bot
        run: |
          xvfb-run --server-args="-screen 0 1920x1080x24" python bot.py

      - name: Upload Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-run-screenshot
          path: "*.png"
