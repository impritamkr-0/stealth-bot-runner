name: Run EuroDNS Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libasound2t64 \
            libxtst6 \
            libpci3 \
            libpangocairo-1.0-0 \
            libx11-xcb1 \
            libxcb-dri3-0 \
            libdrm2 \
            libgbm1 \
            libxshmfence1 \
            wget \
            unzip \
            tesseract-ocr \
            ffmpeg
      
      - name: Install Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Download Buster Extension
        run: |
          python -c "
          import requests
          import os
          
          urls = [
              'https://github.com/dessant/buster/releases/download/v3.1.0/buster_captcha_solver-3.1.0.crx',
              'https://github.com/dessant/buster/releases/download/v3.0.1/buster_captcha_solver-3.0.1.crx',
          ]
          
          downloaded = False
          for url in urls:
              try:
                  print(f'Trying {url}...')
                  r = requests.get(url, timeout=30, allow_redirects=True)
                  if r.status_code == 200 and len(r.content) > 1000:
                      with open('buster.crx', 'wb') as f:
                          f.write(r.content)
                      print(f'Success: {len(r.content)} bytes')
                      downloaded = True
                      break
              except Exception as e:
                  print(f'Failed: {e}')
          
          if not downloaded:
              print('WARNING: Buster not downloaded, continuing without it')
              open('buster.crx', 'w').close()
          "
      
      - name: Run Bot
        env:
          DISPLAY: :99
        run: |
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          sleep 3
          python bot.py
      
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: "*.png"
      
      - name: Upload Credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credentials
          path: "credentials.txt"
