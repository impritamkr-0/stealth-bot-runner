name: Run EuroDNS Bot

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg, Xvfb, Chrome)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb google-chrome-stable

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot in Virtual Framebuffer (Xvfb)
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python bot.py
